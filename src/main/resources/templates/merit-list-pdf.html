<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Official Merit List</title>
    <style>
        @page {
            size: A4;
            margin: 15mm;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 11px;
            color: #000;
            line-height: 1.3;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        .school-name {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .report-title {
            font-size: 16px;
            font-weight: bold;
            text-decoration: underline;
            margin: 10px 0;
            text-transform: uppercase;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 6px 4px;
            text-align: center;
        }

        th {
            background-color: #f0f0f0;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 10px;
        }

        td {
            font-size: 11px;
        }

        .text-left {
            text-align: left;
            padding-left: 8px;
        }

        .footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            page-break-inside: avoid;
        }

        .signature-box {
            text-align: center;
            width: 200px;
        }

        .signature-line {
            border-top: 1px solid #000;
            margin-bottom: 5px;
            margin-top: 40px;
        }

        .system-footer {
            margin-top: 20px;
            font-size: 8px;
            text-align: center;
            border-top: 1px solid #ccc;
            padding-top: 5px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="school-name" th:text="${schoolName}">SCHOOL NAME</div>
        <div class="report-title">OFFICIAL MERIT LIST</div>
        <div>Academic Session: <span th:text="${sessionName}">2024-2025</span></div>
    </div>

    <div class="meta-info">
        <div>Class: <span th:text="${className}">10</span></div>
        <div>Date: <span th:text="${#temporals.format(reportDate, 'dd-MM-yyyy')}">01-01-2025</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 5%;">Rank</th>
                <th style="width: 15%;">Roll No</th>
                <th style="width: 35%;" class="text-left">Student Name</th>
                <th style="width: 10%;">GPA</th>
                <th style="width: 10%;">Total Marks</th>
                <th style="width: 10%;">Grade</th>
                <th style="width: 15%;">Result</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${meritList}">
                <td th:text="${item.rank}">1</td>
                <td th:text="${item.student.rollNumber}">101</td>
                <td class="text-left" th:text="${item.student.name}">Student Name</td>
                <td th:text="${#numbers.formatDecimal(item.gpa, 1, 2)}">5.00</td>
                <td th:text="${item.totalObtained}">500</td>
                <td th:text="${item.overallGrade}">A+</td>
                <td th:text="${item.result}">PASS</td>
            </tr>
        </tbody>
    </table>

    <div class="footer">
        <div class="signature-box">
            <div class="signature-line"></div>
            <div>Class Teacher</div>
        </div>
        <div class="signature-box">
            <div class="signature-line"></div>
            <div>Principal</div>
        </div>
    </div>

    <div class="system-footer">
        Generated by Result Management System | <span th:text="${schoolName}"></span>
    </div>
</body>

</html>
